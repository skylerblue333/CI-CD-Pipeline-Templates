name: docker-ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: local/app:${{ github.sha }}
      - name: Require non-root runtime user
        run: |
          user="$(docker inspect -f '{{.Config.User}}' local/app:${{ github.sha }})"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "root"
